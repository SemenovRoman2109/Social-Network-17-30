{% load static %}

<form action="{% url 'register' %}" method="post" id="registerForm" class="opened-form">
    <div class = "row">
        <h1 class = "active">Реєстрація</h1>
        <h1 id = "openLogin">Авторизація</h1>
    </div>
    <h4>Приєднуйся до World IT</h4>
    
    <div class = "form-content">
        {% csrf_token %}
        {{register_form.as_p}}
    </div>
    <button type="submit">Створити акаунт</button>
</form>
