<form action="{% url 'login' %}" method="post" id="loginForm">
    <div class = "row">
        <h1 id = "openRegister">Реєстрація</h1>
        <h1 class = "active">Авторизація</h1>
    </div>
    <h4>Приєднуйся до World IT</h4>
    
    <div class = "form-content">
        {% csrf_token %}
        {{login_form.as_p}}
    </div>
    <button type="submit">Увійти</button>
</form>
