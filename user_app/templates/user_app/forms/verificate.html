<form action="{% url 'confirm_code' %}" method="post" id="verificateForm">
    <h1>Підтвердження пошти</h1>
    <p>Ми надіслали 6-значний код на вашу пошту <b>(you@example.com)</b>. Введіть його нижче, щоб підтвердити акаунт</p>
    {% csrf_token %}
    {{verify_code_form.as_p}}
    <button type="submit">Підтвердити</button>
    <p id = "backToRegister">Назад</p>
</form>
